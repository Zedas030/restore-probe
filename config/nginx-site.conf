# /etc/nginx/sites-available/restore-probe – Restore Probe report (static, read-only)
server {
    listen 8096;
    listen [::]:8096;
    server_name _;
    root /var/lib/restore-probe/www;
    index index.html;
    charset utf-8;
    add_header Cache-Control "no-cache";
    location / {
        try_files $uri $uri/ =404;
    }
}
