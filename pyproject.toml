[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restore-probe"
version = "1.1.0"
description = "Proves every night that backups can actually be restored: restore, start in an isolated sandbox, compare the data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "securetar>=2025.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
restore-probe = "restore_probe.cli:main"

[tool.setuptools.packages.find]
include = ["restore_probe*"]

[tool.setuptools.package-data]
restore_probe = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
